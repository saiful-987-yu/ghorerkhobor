name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-user-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: user-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ghorer-khobor-user-debug
          path: user-app/app/build/outputs/apk/debug/app-debug.apk

  build-admin-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: admin-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ghorer-khobor-admin-debug
          path: admin-app/app/build/outputs/apk/debug/app-debug.apk
